<!DOCTYPE html>
<html>
<head>
    <title>Pakistan House Price Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        form { background: #f4f4f4; padding: 20px; border-radius: 5px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🏠 Pakistan House Price Predictor</h1>
    <p>Enter property details to predict the price</p>

    <form action="/predict" method="POST">
        {% for feat in feature_meta %}
            <label>{{ feat.name }}:</label>
            {% if feat.type == 'categorical' %}
                <select name="{{ feat.field }}" required>
                    <option value="">-- Select {{ feat.name }} --</option>
                    {% for option in feat.options %}
                        <option value="{{ option }}">{{ option }}</option>
                    {% endfor %}
                </select>
            {% else %}
                <input type="number" step="any" name="{{ feat.field }}" placeholder="Enter {{ feat.name }}" required>
            {% endif %}
        {% endfor %}

        <button type="submit">Predict Price</button>
    </form>
</body>
</html>
